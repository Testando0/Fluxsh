<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bunix | Gerador Oficial Crisálida</title>
    <style>
        :root { --primary: #00d4ff; --bg: #050505; --card-bg: #111; }
        body { background: var(--bg); color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: var(--card-bg); border: 1px solid var(--primary); padding: 30px; border-radius: 20px; width: 90%; max-width: 450px; text-align: center; box-shadow: 0 0 30px rgba(0,212,255,0.15); transition: 0.3s; }
        h1 { color: var(--primary); text-transform: uppercase; margin: 0; letter-spacing: 2px; }
        p { font-size: 12px; color: #777; margin-bottom: 25px; }
        
        .input-group { position: relative; margin-bottom: 20px; }
        input { width: 100%; padding: 15px; border-radius: 12px; border: 1px solid #333; background: #000; color: #fff; box-sizing: border-box; outline: none; transition: 0.3s; }
        input:focus { border-color: var(--primary); box-shadow: 0 0 10px rgba(0,212,255,0.3); }
        
        button { width: 100%; padding: 15px; border-radius: 12px; border: none; background: var(--primary); color: #000; font-weight: bold; cursor: pointer; text-transform: uppercase; transition: 0.2s; }
        button:hover { opacity: 0.9; transform: scale(1.02); }
        button:disabled { background: #444; cursor: not-allowed; transform: scale(1); }

        #result { margin-top: 25px; min-height: 200px; border: 2px dashed #222; border-radius: 15px; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; background: #080808; padding: 10px; }
        
        /* Garante que a imagem nunca quebre o layout e seja sempre visível */
        #result img {
            width: 100%;
            max-width: 100%;
            height: auto;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            display: block;
            object-fit: cover;
        }
        
        .loader { border: 4px solid #1a1a1a; border-top: 4px solid var(--primary); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        .error-msg { color: #ff4d4d; font-size: 14px; padding: 20px; }
        .download-btn { margin-top: 15px; color: var(--primary); text-decoration: none; font-size: 13px; border: 1px solid var(--primary); padding: 8px 15px; border-radius: 8px; transition: 0.3s; display: inline-block; }
        .download-btn:hover { background: var(--primary); color: #000; }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="card">
    <h1>BUNIX 🦋</h1>
    <p>Gerador Oficial da Crisálida</p>
    
    <div class="input-group">
        <input type="text" id="q" placeholder="Ex: Um astronauta de neon no espaço..." autocomplete="off">
    </div>
    
    <button id="btn" onclick="generate()">Gerar Arte</button>

    <div id="result">
        <span style="color: #444;">Aguardando comando...</span>
    </div>
</div>

<script>
    document.getElementById('q').addEventListener('keypress', (e) => e.key === 'Enter' && generate());

    async function generate() {
        const promptInput = document.getElementById('q');
        const btn = document.getElementById('btn');
        const result = document.getElementById('result');
        const query = promptInput.value.trim();

        if (!query) return alert("O que vamos criar hoje? Digite algo!");

        btn.disabled = true;
        btn.innerText = "Sintonizando...";
        result.innerHTML = '<div class="loader"></div><p style="margin-top:15px; color:var(--primary)">Criando sua obra...</p>';

        try {
            const response = await fetch('/api/generate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ prompt: query })
            });

            const contentType = response.headers.get("content-type") || "";

            // Caso 1: Resposta é imagem binária direta
            if (contentType.includes("image/")) {
                const blob = await response.blob();

                // Valida que o blob tem conteúdo antes de criar a URL
                if (blob.size === 0) throw new Error("A imagem recebida está vazia.");

                const url = URL.createObjectURL(blob);
                renderImage(url, result, true); // true = é objectURL, precisará de revogação

            // Caso 2: Resposta JSON (URL ou erro)
            } else if (contentType.includes("application/json")) {
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || data.mensagem || `Erro ${response.status}`);
                }

                if (data.url) {
                    renderImage(data.url, result, false);
                } else {
                    throw new Error(data.error || data.mensagem || "Resposta inesperada do servidor.");
                }

            } else {
                // Tenta tratar como blob de qualquer forma
                if (!response.ok) throw new Error(`Erro do servidor: ${response.status}`);

                const blob = await response.blob();
                if (blob.size === 0) throw new Error("Resposta vazia recebida.");

                const url = URL.createObjectURL(blob);
                renderImage(url, result, true);
            }

        } catch (err) {
            console.error(err);
            result.innerHTML = `<div class="error-msg">⚠️ ${err.message}</div>`;
        } finally {
            btn.disabled = false;
            btn.innerText = "Gerar Arte";
        }
    }

    function renderImage(url, container, isObjectURL) {
        // Limpa o container antes de inserir
        container.innerHTML = "";

        const img = document.createElement("img");
        img.alt = "Arte Bunix";

        // Detecta erros de carregamento da imagem antes de exibir
        img.onerror = () => {
            container.innerHTML = `<div class="error-msg">⚠️ Imagem corrompida ou formato inválido.<br>Tente gerar novamente.</div>`;
            if (isObjectURL) URL.revokeObjectURL(url); // libera memória
        };

        img.onload = () => {
            // Imagem carregou com sucesso — adiciona o botão de download
            const link = document.createElement("a");
            link.href = url;
            link.download = "bunix-arte.jpg";
            link.className = "download-btn";
            link.textContent = "⬇️ Salvar Arte";
            container.appendChild(link);
        };

        img.src = url;
        container.appendChild(img);
    }
</script>

</body>
</html>
